name: formbricks
description: >-
  Formbricks Flutter SDK — connect your Flutter app to Formbricks, identify
  users, track actions, and render targeted in-app surveys.
version: 1.3.1
homepage: https://formbricks.com
repository: https://github.com/formbricks/flutter
issue_tracker: https://github.com/formbricks/flutter/issues

# Part of the root pub workspace — shares the root lockfile + analysis config.
resolution: workspace

environment:
  # The real floor, set by the dependencies' own constraints:
  # webview_flutter_android ^4.14.1 needs Flutter 3.44 / Dart 3.12. CI's
  # unit-tests (min) job runs on this floor; raise both together.
  sdk: ^3.12.0
  flutter: ">=3.44.0"

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.5.6
  clock: ^1.1.3
  webview_flutter: ^4.14.1
  # Android-specific APIs are used to disable file/content access.
  webview_flutter_android: ^4.14.1
  url_launcher: ^6.3.3
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  fake_async: ^1.3.0

flutter:
