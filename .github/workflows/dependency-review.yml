name: Dependency Review

# Blocks pull requests that introduce a dependency with a known High or
# Critical vulnerability, comparing the PR's dependency-graph manifests with the
# base branch.
#
# Coverage: Pub packages (pubspec.lock). Gradle/Maven changes are not covered
# here because dependency snapshots are only submitted for the default branch;
# see "Limitations" in docs/DEPENDENCY_SECURITY.md. Read-only; findings are
# never auto-dismissed.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: false
