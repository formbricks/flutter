name: Dependency Submission

# Android/Gradle dependency coverage for GitHub's dependency graph.
#
# GitHub detects Pub packages from pubspec.lock automatically but cannot see the
# native Android dependencies (Maven artifacts, Gradle/Kotlin/Android build
# plugins), because they are only known after Gradle resolves the playground
# build. This workflow resolves them, checks the snapshot is complete, and
# submits it so Dependabot alerts cover them. See docs/DEPENDENCY_SECURITY.md.
#
# Trigger notes:
#   * push to main + weekly: collect, assess, submit the default-branch graph.
#   * workflow_dispatch from main: same. From any other branch: collect and
#     assess only (a dry run); nothing is submitted.
#   * No pull_request trigger on purpose: submitting from PRs needs a
#     privileged workflow that handles untrusted snapshots. See the follow-ups
#     in the doc.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  collect:
    name: Collect and assess Gradle dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Read-only: Gradle runs third-party plugin build scripts here.
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # High/Critical findings are surfaced as a warning + job summary here and
      # do not fail the default-branch run; an incomplete inventory does.
      - name: Collect, validate and assess
        uses: ./.github/actions/gradle-dependency-snapshot

  submit:
    name: Submit dependency snapshot
    needs: collect
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with a write token. It runs no repository code: it downloads
    # the validated snapshot, re-checks it is bound to this commit and ref, and
    # posts it to the Dependency Submission API.
    permissions:
      contents: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-evidence-${{ github.sha }}
          path: dependency-evidence

      - name: Submit snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          shopt -s nullglob
          files=(dependency-evidence/gradle-snapshot/*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No dependency snapshot in the evidence artifact; refusing to submit."
            exit 1
          fi
          for f in "${files[@]}"; do
            snap_sha=$(jq -r '.sha' "$f")
            snap_ref=$(jq -r '.ref' "$f")
            count=$(jq '[.manifests[].resolved | length] | add // 0' "$f")
            if [ "$snap_sha" != "$SHA" ] || [ "$snap_ref" != "$REF" ] || [ "$count" -lt 100 ]; then
              echo "::error::$f is not a valid snapshot for $REF@$SHA (sha=$snap_sha ref=$snap_ref components=$count)."
              exit 1
            fi
            gh api --method POST "repos/$REPO/dependency-graph/snapshots" --input "$f"
            echo "Submitted $f ($count components) for $SHA" >> "$GITHUB_STEP_SUMMARY"
          done
