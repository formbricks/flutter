name: Release

on:
  push:
    tags:
      # Glob is coarse; the "Validate release tag" step does the strict semver
      # check. pub.dev automated publishing trusts only push/workflow_dispatch
      # events — NOT release events — so we publish on version-tag pushes.
      - "[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Release Flutter SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # The tag glob in `on:` is coarse, so gate here: abort unless the pushed
      # tag is a semver version — X.Y.Z with optional dot-separated -prerelease
      # and +build identifiers (e.g. 1.2.3, 1.2.3-rc-1, 1.2.3-rc.1, 1.2.3+build.5).
      - name: Validate release tag is a version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?([+][0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "::error::Release tag '$TAG' is not a semver version. Aborting."
            exit 1
          fi
          echo "Release tag '$TAG' OK."

      - name: Set up Dart for pub.dev OIDC
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: make deps-lockfile

      - name: Check formatting
        run: make format-check

      - name: Analyze
        run: make analyze-ci

      - name: Run SDK package tests with coverage
        run: make test-sdk-coverage

      - name: Run playground tests
        run: make test-playground

      - name: Run publish dry run
        run: make pub-publish-dry-run

      - name: Publish to pub.dev
        run: |
          # Prereqs: the pushed tag matches the pubspec version, and pub.dev
          # automated publishing is configured to trust this repo + workflow.
          make pub-publish-force
