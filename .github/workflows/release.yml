name: Release

# Publishing a GitHub release creates its tag, and that tag push runs this
# workflow. The other SDK repos trigger on `release: published` instead, but
# pub.dev automated publishing only accepts an OIDC token from a workflow run
# triggered by pushing a tag that matches the package's tag pattern
# ({{version}}). See RELEASING.md.
on:
  push:
    tags:
      # Coarse glob; set_version_from_tag.sh does the strict semver check.
      # It also matches prereleases such as 1.4.0-rc.1.
      - "[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  PACKAGE: formbricks
  PACKAGE_DIR: packages/formbricks

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout and reading the GitHub release notes
      id-token: write # pub.dev OIDC

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag is the version. main keeps the 0.0.0-dev placeholder, so the
      # version only ever exists in this checkout.
      - name: Set the version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: tool/release/set_version_from_tag.sh "$TAG" "$PACKAGE_DIR/pubspec.yaml"

      # pub.dev never accepts the same version twice, so a re-run after a
      # successful publish skips straight to verify.
      - name: Check whether pub.dev already has this version
        id: registry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          status="$(tool/release/pub_version.sh status "$PACKAGE" "$TAG")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ $status == "published" ]]; then
            echo "::notice::$PACKAGE $TAG is already on pub.dev; skipping the publish."
          fi

      - name: Add the release notes to CHANGELOG.md
        if: steps.registry.outputs.status == 'missing'
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes"; then
            echo "::warning::No GitHub release found for $TAG; CHANGELOG.md links to the release page instead."
            : > "$notes"
          fi
          tool/release/prepend_changelog.sh "$PACKAGE_DIR/CHANGELOG.md" "$TAG" "$notes" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"

      # `pub publish` warns about uncommitted files, and a warning fails the
      # dry run. This commit stays on the runner: the checkout has no
      # credentials to push it.
      - name: Commit the release files on the runner
        if: steps.registry.outputs.status == 'missing'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --all --message "chore: release $TAG"

      # Creates the OIDC token `pub publish` uses.
      - name: Set up Dart for pub.dev OIDC
        if: steps.registry.outputs.status == 'missing'
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Set up Flutter
        if: steps.registry.outputs.status == 'missing'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          # No cache in a publishing workflow: a poisoned cache would ship.
          cache: false

      - name: Install dependencies
        if: steps.registry.outputs.status == 'missing'
        run: make deps-lockfile

      # Builds and validates the archive exactly as pub.dev receives it.
      - name: Build the package
        if: steps.registry.outputs.status == 'missing'
        run: make pub-publish-dry-run

      - name: Publish to pub.dev
        if: steps.registry.outputs.status == 'missing'
        run: make pub-publish-force

  verify:
    name: Verify on pub.dev
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A -suffix version is a pub.dev prerelease by itself, so seeing the
      # version is seeing it on the right channel.
      - name: Wait for pub.dev to serve the version
        env:
          TAG: ${{ github.ref_name }}
          PUB_WAIT_TIMEOUT: "900"
        run: |
          tool/release/pub_version.sh wait "$PACKAGE" "$TAG"
          echo "Published [$PACKAGE $TAG](https://pub.dev/packages/$PACKAGE/versions/$TAG) on pub.dev." >> "$GITHUB_STEP_SUMMARY"
