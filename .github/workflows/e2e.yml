name: E2E

# The SDK golden journey against a published Formbricks image, with Patrol on apps/playground.
# ci.yml calls it on every PR (fork PRs skip it: no secrets) with the latest release; run it by hand
# with `server_version` (for example 6.3.0-rc.1) as the pre-release QA.
#
# - `android`: one Linux job boots and seeds the server (e2e/server), then runs the journey on an
#   emulator that reaches it at http://10.0.2.2:3000.
# - `server` + `ios`: GitHub's macOS runners cannot run Docker, so the Linux job opens a Cloudflare
#   quick tunnel to its server (e2e/tunnel) and the two jobs, side by side with no `needs` between
#   them, swap run artifacts: the tunnel URL one way, the journey's result the other. A job's
#   outputs only publish when it ends, which is why the hand-off uses artifacts.
# - `server-version` checks the image tag once, before the other three start.
on:
  workflow_call:
    inputs:
      server_version:
        description: Formbricks image tag (ghcr.io/formbricks/formbricks) to test against
        type: string
        default: latest
    secrets:
      ENTERPRISE_LICENSE_KEY:
        description: Enterprise license with the Contacts feature
        required: false
  workflow_dispatch:
    inputs:
      server_version:
        description: Formbricks image tag (ghcr.io/formbricks/formbricks) to test against, for example 6.3.0-rc.1
        type: string
        default: latest

permissions:
  contents: read
  actions: read # the iOS pair polls the run's artifacts for each other's hand-off

env:
  # Unique per attempt; the retry inside the journey step reuses it, which the survey allows. Android
  # and iOS use the same value against two separate servers.
  E2E_USER_ID: qa-user-${{ github.run_id }}-${{ github.run_attempt }}
  E2E_FEEDBACK: Golden journey feedback ${{ github.run_id }}
  SERVER_ARTIFACT: e2e-server-attempt-${{ github.run_attempt }}
  DONE_ARTIFACT: e2e-journey-done-attempt-${{ github.run_attempt }}
  PATROL_CLI_VERSION: 4.9.0
  PATROL_ANALYTICS_ENABLED: "false"

jobs:
  # Checks the image tag once; the jobs that start a server read it from here.
  server-version:
    name: Server version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check the server version
        id: check
        env:
          SERVER_VERSION: ${{ inputs.server_version || 'latest' }}
        run: |
          if [[ ! "${SERVER_VERSION}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::server_version '${SERVER_VERSION}' is not a valid image tag"
            exit 1
          fi
          echo "version=${SERVER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Testing against ghcr.io/formbricks/formbricks:${SERVER_VERSION}"

  android:
    name: Golden journey (Patrol, Android)
    needs: server-version
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FORMBRICKS_VERSION: ${{ needs.server-version.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Restore Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-e2e-${{ hashFiles('pubspec.lock', 'apps/playground/android/**/*.gradle*', 'apps/playground/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies and the Patrol CLI
        run: |
          make deps-lockfile
          dart pub global activate patrol_cli "${PATROL_CLI_VERSION}"
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"

      # Before the server: it is up about a minute after the image pull, so build first.
      - name: Build the playground and the journey
        run: e2e/flutter/run-journey.sh android-build

      - name: Start the Formbricks server and bootstrap the tenant
        env:
          ENTERPRISE_LICENSE_KEY: ${{ secrets.ENTERPRISE_LICENSE_KEY }}
        run: e2e/server/up.sh

      # Stops with a clear error at the license gate when ENTERPRISE_LICENSE_KEY is missing.
      - name: Seed the survey through the V1 API
        env:
          ENTERPRISE_LICENSE_KEY: ${{ secrets.ENTERPRISE_LICENSE_KEY }}
        run: e2e/server/seed.sh

      # Hosted runners already expose /dev/kvm; the emulator only needs permission to use it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The Flutter SDK accepts http://; the playground's debug build allows cleartext to 10.0.2.2.
      - name: Run the golden journey
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on -no-snapshot
          disable-animations: true
          script: e2e/flutter/run-journey.sh android

      - name: Assert the response through the V1 API
        run: e2e/server/assert-response.sh

      - name: Delete the seeded data through the V1 API
        run: e2e/server/cleanup.sh

      - name: Stop the server and collect its logs
        if: always()
        run: e2e/server/down.sh e2e/server/logs

      - name: Upload the server logs and journey reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-golden-journey-android-attempt-${{ github.run_attempt }}
          path: |
            e2e/server/logs
            e2e/flutter/reports
          if-no-files-found: ignore
          retention-days: 7

  server:
    name: Server and tunnel for iOS (Linux)
    needs: server-version
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FORMBRICKS_VERSION: ${{ needs.server-version.outputs.version }}
      CLOUDFLARED_VERSION: 2026.10.7
      CLOUDFLARED_SHA256: 1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cloudflared
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  $RUNNER_TEMP/cloudflared" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cloudflared"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Start the Formbricks server and bootstrap the tenant
        env:
          ENTERPRISE_LICENSE_KEY: ${{ secrets.ENTERPRISE_LICENSE_KEY }}
        run: e2e/server/up.sh

      # Stops with a clear error at the license gate when ENTERPRISE_LICENSE_KEY is missing.
      - name: Seed the survey through the V1 API
        env:
          ENTERPRISE_LICENSE_KEY: ${{ secrets.ENTERPRISE_LICENSE_KEY }}
        run: e2e/server/seed.sh

      # The simulator cannot reach this runner; the quick tunnel gives it an https:// URL.
      - name: Open a tunnel to the server
        run: e2e/tunnel/start.sh

      - name: Hand the tunnel URL to the macOS job
        id: publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.SERVER_ARTIFACT }}
          path: e2e/tunnel/.state/server.env
          if-no-files-found: error
          retention-days: 1

      # Without this the macOS job would wait for a URL that never comes.
      - name: Tell the macOS job the server failed
        if: failure() && steps.publish.outcome != 'success'
        run: |
          mkdir -p e2e/tunnel/.state
          echo "E2E_SERVER_FAILED=1" > e2e/tunnel/.state/server.env

      - name: Hand the failure to the macOS job
        if: failure() && steps.publish.outcome != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.SERVER_ARTIFACT }}
          path: e2e/tunnel/.state/server.env
          retention-days: 1

      - name: Keep the server up until the macOS journey is done
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          e2e/tunnel/await-artifact.sh "${DONE_ARTIFACT}" e2e/tunnel/.state/done 2400
          if ! grep -qx 'E2E_JOURNEY_RESULT=success' e2e/tunnel/.state/done/journey.env; then
            echo "::error::the iOS journey did not pass ($(cat e2e/tunnel/.state/done/journey.env)); see the Golden journey (Patrol, iOS) job"
            exit 1
          fi

      - name: Assert the response through the V1 API
        run: e2e/server/assert-response.sh

      - name: Delete the seeded data through the V1 API
        run: e2e/server/cleanup.sh

      - name: Close the tunnel
        if: always()
        run: e2e/tunnel/stop.sh e2e/server/logs

      - name: Stop the server and collect its logs
        if: always()
        run: e2e/server/down.sh e2e/server/logs

      - name: Upload the server logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-golden-journey-ios-server-attempt-${{ github.run_attempt }}
          path: e2e/server/logs
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: Golden journey (Patrol, iOS)
    # Only so a bad server_version stops it too, instead of it waiting for a
    # server that never starts.
    needs: server-version
    runs-on: macos-26
    timeout-minutes: 50
    env:
      XCODE_VERSION: "26.3"
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        # xcode-select, not DEVELOPER_DIR, so the simulator service follows it too.
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies and the Patrol CLI
        run: |
          make deps-lockfile
          dart pub global activate patrol_cli "${PATROL_CLI_VERSION}"
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"

      # Before waiting for the server: the build and the simulator boot overlap the server's boot.
      - name: Boot the simulator and build the playground
        run: e2e/flutter/run-journey.sh ios-build

      - name: Wait for the server's tunnel URL
        id: server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          e2e/tunnel/await-artifact.sh "${SERVER_ARTIFACT}" "$RUNNER_TEMP/server" 1500
          # Assigned first: a failing command substitution inside `echo` would not fail the step.
          url="$(e2e/tunnel/server-url.sh "$RUNNER_TEMP/server/server.env")"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Run the golden journey
        id: journey
        env:
          E2E_APP_URL: ${{ steps.server.outputs.url }}
        run: e2e/flutter/run-journey.sh ios

      # Always, so the server job stops waiting even when this job failed earlier.
      - name: Tell the server job the journey is done
        if: always()
        env:
          RESULT: ${{ steps.journey.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/done"
          printf 'E2E_JOURNEY_RESULT=%s\n' "${RESULT:-skipped}" > "$RUNNER_TEMP/done/journey.env"

      - name: Hand the result to the server job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.DONE_ARTIFACT }}
          path: ${{ runner.temp }}/done/journey.env
          retention-days: 1

      - name: Upload the journey reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-golden-journey-ios-attempt-${{ github.run_attempt }}
          path: e2e/flutter/reports
          if-no-files-found: ignore
          retention-days: 7
