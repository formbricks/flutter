name: CI

# Every PR check for the Flutter SDK. "PR Check Summary" is the only required
# check; it fails unless every job succeeded or was an allowed skip.
# Job ids are shared with the other Formbricks SDK repos.

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

# PR runs cancel superseded runs; runs on main and in the merge queue get their
# own group per commit, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: make deps-lockfile

      - name: Analyze (infos and warnings fail)
        run: make analyze-ci

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: make deps-lockfile

      # dart format --set-exit-if-changed, plus prettier --check for Markdown.
      - name: Check formatting
        run: make format-check

  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
            target: build-android
          - platform: ios
            runner: macos-26
            target: build-ios-no-codesign
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Restore Gradle cache
        if: matrix.platform == 'android'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pubspec.lock', 'apps/playground/android/**/*.gradle*', 'apps/playground/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: make deps-lockfile

      - name: Build the playground app
        env:
          MAKE_TARGET: ${{ matrix.target }}
        run: make "$MAKE_TARGET"

  unit-tests:
    name: unit-tests (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The pinned dev SDK, with the committed lockfile.
          - sdk: pinned
            flutter-version-file: .fvmrc
            flutter-version: ""
            deps-target: deps-lockfile
          # The published package's floor (packages/formbricks/pubspec.yaml),
          # resolved fresh, as a consumer on that SDK would get it.
          - sdk: min
            flutter-version-file: ""
            flutter-version: "3.44.9"
            deps-target: deps
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: ${{ matrix.flutter-version-file }}
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Install dependencies
        env:
          DEPS_TARGET: ${{ matrix.deps-target }}
        run: make "$DEPS_TARGET"

      - name: Run SDK package tests with coverage
        run: make test-sdk-machine

      - name: Run playground app tests
        run: make test-playground

      # The release, PR Check Summary and E2E harness scripts. They don't
      # depend on the Flutter SDK, so one leg runs them.
      - name: Run the script tests
        if: matrix.sdk == 'pinned'
        run: make script-tests

      - name: Upload coverage for Sonar
        if: matrix.sdk == 'pinned'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: packages/formbricks/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-test-reports-${{ matrix.sdk }}
          path: test-results/
          if-no-files-found: ignore

  package-check:
    name: package-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: make deps-lockfile

      - name: Run publish dry run
        run: make pub-publish-dry-run

      - name: Install pana
        run: make pana-install

      - name: Run pana
        run: make pana

  sonarqube:
    name: sonarqube
    needs: unit-tests
    # SONAR_TOKEN isn't available to fork PRs. PR Check Summary allows this
    # skip under the same condition.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # PR decoration
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      # Sonar's Dart analysis resolves imports through the package config.
      # The coverage comes from the unit-tests job; this job runs no tests.
      - name: Install dependencies
        run: make deps-lockfile

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: packages/formbricks/coverage

      # sonar-project.properties sets sonar.qualitygate.wait=true, so a failed
      # quality gate fails this step.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  dependency-review:
    name: dependency-review
    # Compares the PR's (or merge group's) dependency graph with its base, so
    # there is nothing to compare on a push to main.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pub packages only; see "Limitations" in docs/DEPENDENCY_SECURITY.md.
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          head-ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      # Also runs shellcheck (preinstalled on the runner) on every run: block.
      - name: Run actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false

      # The summary, release and E2E harness scripts; their tests run in
      # unit-tests.
      - name: Shellcheck the repo's shell scripts
        run: make shellcheck

  e2e-tests:
    name: e2e-tests
    # ENTERPRISE_LICENSE_KEY isn't available to fork PRs. PR Check Summary
    # allows this skip under the same condition.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # A called workflow can't exceed these; its iOS jobs poll the run's artifacts.
    permissions:
      contents: read
      actions: read
    # actionlint 1.7.12 rejects the `$/` form zizmor suggests.
    uses: ./.github/workflows/e2e.yml # zizmor: ignore[self-repository]
    secrets:
      ENTERPRISE_LICENSE_KEY: ${{ secrets.ENTERPRISE_LICENSE_KEY }}

  pr-check-summary:
    name: PR Check Summary
    if: always()
    needs:
      - lint
      - format
      - build
      - unit-tests
      - package-check
      - sonarqube
      - dependency-review
      - workflow-lint
      - e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # .github/scripts/pr_check_summary.sh decides which skips are allowed.
      - name: Check job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: .github/scripts/pr_check_summary.sh
