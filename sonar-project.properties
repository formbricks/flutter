# SonarCloud config. Dart analyzed natively; LCOV coverage from the SonarQube
# workflow. No hard quality gate yet.
sonar.projectKey=formbricks_flutter
sonar.organization=formbricks
sonar.sourceEncoding=UTF-8

# Dart source lives in the SDK package and the demo app.
sonar.sources=packages/formbricks_flutter/lib,apps/playground/lib
sonar.tests=packages/formbricks_flutter/test,apps/playground/test
sonar.test.inclusions=**/*_test.dart

# Exclude the demo app from metrics — it's QA scaffolding, not shipped code.
sonar.exclusions=**/build/**,**/.dart_tool/**,**/*.g.dart,**/*.freezed.dart,**/android/**,**/ios/**,apps/playground/**
sonar.coverage.exclusions=**/build/**,**/.dart_tool/**,apps/playground/**,**/*_test.dart

# LCOV coverage from `flutter test --coverage` (SonarQube workflow).
sonar.dart.lcov.reportPaths=packages/formbricks_flutter/coverage/lcov.info
