# SonarCloud config. Dart analyzed natively; LCOV coverage comes from the
# SonarQube workflow.
sonar.projectKey=formbricks_flutter
sonar.organization=formbricks
sonar.sourceEncoding=UTF-8

# Dart source lives in the SDK package and the demo app.
sonar.sources=packages/formbricks/lib,apps/playground/lib
sonar.tests=packages/formbricks/test,apps/playground/test
sonar.test.inclusions=**/*_test.dart

# Exclude the demo app from metrics — it's QA scaffolding, not shipped code.
sonar.exclusions=**/build/**,**/.dart_tool/**,**/*.g.dart,**/*.freezed.dart,**/android/**,**/ios/**,apps/playground/**
sonar.coverage.exclusions=**/build/**,**/.dart_tool/**,apps/playground/**,**/*_test.dart

# WebView JavaScript is required for the Formbricks survey runtime. The host is
# constrained to one bridge, same-origin navigation, external URL allowlisting,
# disabled Android file/content access, and cache/local-storage clearing.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=dart:S6362
sonar.issue.ignore.multicriteria.e1.resourceKey=packages/formbricks/lib/src/widgets/default_webview_host.dart
sonar.issue.ignore.multicriteria.e2.ruleKey=dart:S7409
sonar.issue.ignore.multicriteria.e2.resourceKey=packages/formbricks/lib/src/widgets/default_webview_host.dart

# LCOV coverage from `flutter test --coverage` (SonarQube workflow).
sonar.dart.lcov.reportPaths=packages/formbricks/coverage/lcov.info
